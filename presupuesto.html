            </div>
          </div>

          <div class="col-full">
            <div class="form-group">
              <label for="mensaje">Detalles de la obra o consulta</label>

            </div>
          </div>

          <div class="col-full">

          </div>

          <div class="col-full">
            <button type="submit" class="btn-submit">Enviar Solicitud</button>
